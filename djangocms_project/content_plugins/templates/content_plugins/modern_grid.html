{% load thumbnail sekizai_tags %}

<div class="slide slide-modern cms-plugin-slide" data-slide-type="modern_grid"
    data-dept-title="{{ instance.department_title }}"
    data-dept-logo="{% if instance.department_logo %}{{ instance.department_logo.url }}{% endif %}"
    data-dept-url="{{ instance.department_website }}">

    <h1 class="title-large" style="margin-bottom: 20px; z-index: 10; position: relative;">{{ instance.title }}</h1>

    <div class="modern-grid-container presentation-grid">
        {% for item in instance.items.all %}
        <div class="modern-slot" id="modern-slot-{{ instance.id }}-{{ forloop.index0 }}"></div>
        {% endfor %}
    </div>

    <!-- Images and labels added directly to slide (no wrapper) -->
    {% for item in instance.items.all %}
    {% thumbnail item.image 1500x1000 crop upscale as thumb %}
    <img src="{% if thumb %}{{ thumb.url }}{% else %}{{ item.image.url }}{% endif %}" class="modern-photo"
        id="modern-photo-{{ instance.id }}-{{ forloop.index0 }}" alt="{{ item.subtitle }}"
        onerror="console.error('Modern Grid: Image failed to load', this.src)">
    <div class="name-label" id="modern-label-{{ instance.id }}-{{ forloop.index0 }}">{{ item.subtitle }}</div>
    {% endfor %}
</div>

{% addtoblock "js" %}
<script>
    (function () {
        window.SlideHandlers.modern_grid = function (element, completeCallback) {
            console.log("Modern Grid handler: started execution for element", element);

            const timeline = gsap.timeline({ onComplete: completeCallback });

            const images = element.querySelectorAll('.modern-photo');
            const labels = element.querySelectorAll('.name-label');
            const slots = element.querySelectorAll('.modern-slot');

            console.log(`Modern Grid handler: Found ${images.length} images, ${labels.length} labels, ${slots.length} slots`);

            if (images.length === 0) {
                console.warn("Modern Grid handler: No items found, skipping...");
                gsap.to(element, {
                    opacity: 1, visibility: 'visible', duration: 0.5, onComplete: () => {
                        setTimeout(completeCallback, 2000);
                    }
                });
                return timeline;
            }

            // Force slide visibility
            gsap.set(element, { visibility: 'visible', opacity: 1 });

            // CRITICAL: Reset all positions and states at start
            gsap.set(images, {
                opacity: 0,
                visibility: 'hidden',
                top: '50%',
                left: '50%',
                xPercent: -50,
                yPercent: -50,
                width: '0vh',
                height: '0vh',
                aspectRatio: "3/2",
                scale: 1
            });
            gsap.set(labels, { opacity: 0, visibility: 'hidden' });

            images.forEach((img, i) => {
                const label = labels[i];
                const slot = slots[i];

                if (!slot) return;

                const rect = slot.getBoundingClientRect();
                const start = i * 2.8; // Slightly faster cadence

                timeline
                    // 1. Blow up from center
                    .set([img, label], { visibility: 'visible' }, start)
                    .to(img, {
                        opacity: 1,
                        width: "90vh",
                        height: "60vh",
                        duration: 0.8,
                        ease: "back.out(1.2)"
                    }, start)

                    // 2. Show Label
                    .to(label, { opacity: 1, duration: 0.5 }, start + 0.2)

                    // 3. Hide Label
                    .to(label, { opacity: 0, duration: 0.3 }, start + 1.8)

                    // 4. Move to Grid Slot
                    .to(img, {
                        top: rect.top + (rect.height / 2),
                        left: rect.left + (rect.width / 2),
                        xPercent: -50,
                        yPercent: -50,
                        width: rect.width,
                        height: rect.height,
                        duration: 1.2,
                        ease: "power3.inOut"
                    }, start + 1.8);
            });

            // Hold final state then fade out
            timeline
                .to({}, { duration: 4 })
                .to(element, { opacity: 0, duration: 1 });

            return timeline;
        };
    })();
</script>
{% endaddtoblock %}
