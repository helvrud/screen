{% load cms_tags sekizai_tags static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% page_attribute "page_title" %}</title>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/antigravity.css' %}">

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- Particles.js for background effects -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <!-- YouTube API -->
    <script>
        // Define callback functionality BEFORE loading the API
        window.onYouTubeIframeAPIReady = function () {
            window.player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                playerVars: { 'autoplay': 1, 'controls': 0, 'rel': 0, 'mute': 1, 'enablejsapi': 1, 'modestbranding': 1, 'playsinline': 1 },
                events: {
                    'onStateChange': (event) => {
                        if (event.data === YT.PlayerState.ENDED) {
                            if (window.currentVideoCompleteCallback) window.currentVideoCompleteCallback();
                        }
                        if (event.data === YT.PlayerState.PLAYING) {
                            gsap.to('#player', { opacity: 1, duration: 0.5 });
                        }
                    }
                }
            });
        };
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>

    {% render_block "css" %}
</head>

<body>
    <!-- Particles background -->
    <div id="particles-js"></div>

    <!-- Navigation Arrows -->
    <div id="nav-prev" class="nav-arrow" onclick="window.prevSlide()">&#10094;</div>
    <div id="nav-next" class="nav-arrow" onclick="window.nextSlide()">&#10095;</div>

    <!-- CMS Toolbar -->
    {% cms_toolbar %}

    <!-- Main Content (Slides) -->
    <main id="main-content">
        {% placeholder "content" %}
    </main>

    <!-- Video Player Container (Shared) -->
    <div id="slide-video-shared" class="slide slide-video-shared-container"
        style="padding:0; justify-content:center; align-items:center; visibility: hidden; opacity: 0; pointer-events: none;">
        <div class="video-container">
            <div id="player"></div>
        </div>
        <div id="video-dynamic-title" class="video-overlay-title"></div>
    </div>

    <!-- Persistent Department Overlay -->
    <div id="global-side-stripe" class="side-stripe">
        <div id="global-side-title" class="side-title"></div>
        <img id="global-side-logo" class="side-logo" src="" alt="Logo" style="display: none;">
        <div id="global-side-qr" class="side-qr"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        // Initialize handlers namespace for plugins to attach to
        window.SlideHandlers = window.SlideHandlers || {};
    </script>

    {% render_block "js" %}

    <!-- Presentation Logic -->
    <script src="{% static 'js/presentation.js' %}?v=7"></script>

    <!-- Particles Initialization -->
    <script>
        if (typeof particlesJS !== 'undefined') {
            particlesJS("particles-js", {
                "particles": {
                    "number": { "value": 40, "density": { "enable": true, "value_area": 800 } },
                    "color": { "value": "#ffffff" },
                    "shape": { "type": "circle" },
                    "opacity": { "value": 0.2, "random": false },
                    "size": { "value": 3, "random": true },
                    "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.1, "width": 1 },
                    "move": { "enable": true, "speed": 1.0, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
                },
                "interactivity": {
                    "detect_on": "canvas",
                    "events": { "onhover": { "enable": false }, "onclick": { "enable": false }, "resize": true }
                },
                "retina_detect": false
            });
        }
    </script>
</body>

</html>
